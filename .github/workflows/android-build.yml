# Fork-only workflow: builds a test APK of any branch of this fork.
# Run it from the Actions tab ("Android build" -> "Run workflow").
name: Android build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: video-frame-graph
      arch:
        description: Target ABI (Fire TV devices need armeabi-v7a)
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
        default: armeabi-v7a
      package:
        description: Android package name; differs from org.xbmc.kodi so the test build installs next to the regular Kodi
        required: true
        default: org.xbmc.kodi.test

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NDK_VERSION: 28.2.13676358
      SDK_PLATFORM: platforms;android-37.0
      SDK_BUILD_TOOLS: build-tools;37.0.0
      DEPENDS_PREFIX: /home/runner/xbmc-depends
      TARBALLS: /home/runner/xbmc-tarballs

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force > /dev/null || true
          # Keep the preinstalled Android SDK, but drop the NDKs this build does not use
          if [ -d "$ANDROID_HOME/ndk" ]; then
            find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name "$NDK_VERSION" -exec sudo rm -rf {} +
          fi
          df -h /

      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "$SDK_PLATFORM" "$SDK_BUILD_TOOLS" "ndk;$NDK_VERSION"

      - name: Select target
        id: target
        run: |
          case "${{ inputs.arch }}" in
            armeabi-v7a) echo "host=arm-linux-androideabi" >> "$GITHUB_OUTPUT" ;;
            arm64-v8a) echo "host=aarch64-linux-android" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore depends
        id: depends-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPENDS_PREFIX }}
          key: depends-${{ inputs.arch }}-${{ env.NDK_VERSION }}-${{ hashFiles('tools/depends/**') }}

      - name: Configure depends
        working-directory: tools/depends
        run: |
          ./bootstrap
          ./configure \
            --host=${{ steps.target.outputs.host }} \
            --with-sdk-path="$ANDROID_HOME" \
            --with-ndk-path="$ANDROID_HOME/ndk/$NDK_VERSION" \
            --with-tarballs="$TARBALLS" \
            --prefix="$DEPENDS_PREFIX" \
            --enable-debug=no

      - name: Build depends
        if: steps.depends-cache.outputs.cache-hit != 'true'
        working-directory: tools/depends
        run: |
          make -j"$(nproc)"
          df -h /

      - name: Save depends
        if: steps.depends-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DEPENDS_PREFIX }}
          key: ${{ steps.depends-cache.outputs.cache-primary-key }}

      - name: Configure Kodi
        env:
          APP_PACKAGE: ${{ inputs.package }}
        run: |
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$GITHUB_WORKSPACE/build" \
            CMAKE_EXTRA_ARGUMENTS="-DAPP_PACKAGE=$APP_PACKAGE"

      - name: Build Kodi
        working-directory: build
        run: make -j"$(nproc)"

      # Reusing the signing key lets new test builds install over older ones
      - name: Restore signing key
        id: keystore-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Create signing key
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -keystore ~/.android/debug.keystore -v -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keypass android -storepass android \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Save signing key
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Package APK
        working-directory: build
        run: |
          make apk
          ls -la "$GITHUB_WORKSPACE"/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kodi-${{ inputs.arch }}-${{ github.run_number }}
          path: ${{ github.workspace }}/*.apk
          if-no-files-found: error
